# GPU CI, on the JuliaGPU Buildkite infrastructure
# (https://github.com/JuliaGPU/buildkite). GitHub Actions has no GPU, so this is
# the only CI that runs test/test_cuda.jl -- the bit-for-bit comparison of the
# GPU fills with the CPU's -- and the only one that can report coverage for
# ext/RandomDataStreamsCUDAExt.jl, which Codecov otherwise counts as missing.
#
# Coverage. Uploading needs the repository's Codecov token, encrypted with
# JuliaGPU/buildkite's `tools/encrypt` (variable name CODECOV_TOKEN). Paste the
# `env:` snippet it prints below, and uncomment the julia-coverage plugin. Until
# then the step runs the tests without uploading: an absent secret must not be
# able to fail the build.

# env:
#   SECRET_CODECOV_TOKEN: "<output of tools/encrypt>"

steps:
  - label: "CUDA -- Julia v1"
    plugins:
      - JuliaCI/julia#v1:
          version: "1"
      - JuliaCI/julia-test#v1: ~
      # - JuliaCI/julia-coverage#v1:
      #     codecov: true
    agents:
      queue: "cuda"
    env:
      # the thread tests exercise concurrency only with more than one thread
      JULIA_NUM_THREADS: 4
    if: build.message !~ /\[skip tests\]/
    timeout_in_minutes: 60
